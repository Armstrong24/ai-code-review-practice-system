# One-click deploy on Render (free plan). See README "Live website".
services:
  - type: web
    name: ai-code-review-practice-system
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY        # optional: Groq key, fastest AI review (tried first)
        sync: false
      - key: GEMINI_API_KEY      # optional: Gemini key, used if Groq is missing or fails
        sync: false
      - key: ADMIN_EMAILS        # your email; only these accounts can add/delete problems
        sync: false
      - key: SECURE_COOKIES
        value: "true"
      - key: JUDGE_THREADS       # free plan has 512 MB RAM: run one submission at a time
        value: "1"
